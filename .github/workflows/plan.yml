name: OpenTofu Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'tofu/**'
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/**'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  plan:
    name: OpenTofu Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive
          find ../modules -name "*.tf" -exec tofu fmt -check {} \;

      - name: Dev Environment Plan
        id: plan-dev
        run: |
          cd tofu
          tofu init -backend=false
          tofu validate
          tofu plan \
            -var-file=../environments/dev/dev.tfvars \
            -out=../environments/dev/tfplan.out \
            -detailed-exitcode
          echo "dev_changed=$?" >> $GITHUB_OUTPUT

      - name: Prod Environment Plan
        id: plan-prod
        run: |
          cd tofu
          tofu plan \
            -var-file=../environments/prod/prod.tfvars \
            -out=../environments/prod/tfplan.out \
            -detailed-exitcode
          echo "prod_changed=$?" >> $GITHUB_OUTPUT

      - name: Comment Plan Output
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## OpenTofu Plan\n\n' +
                    'Dev: `${{ steps.plan-dev.outputs.dev_changed }}`\n' +
                    'Prod: `${{ steps.plan-prod.outputs.prod_changed }}`'
            })

      - name: Upload Dev Plan
        uses: actions/upload-artifact@v4
        with:
          name: dev-tfplan
          path: environments/dev/tfplan.out

      - name: Upload Prod Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: environments/prod/tfplan.out
