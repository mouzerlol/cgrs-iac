name: OpenTofu Apply

on:
  push:
    branches: [main]
    paths:
      - 'tofu/**'
      - 'modules/**'
      - 'environments/prod/**'
      - '.github/workflows/**'

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive
          find ../modules -name "*.tf" -exec tofu fmt -check {} \;

      - name: Validate
        run: |
          cd tofu
          tofu validate

  plan-prod:
    name: Plan Production
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Init Production
        run: |
          cd tofu
          tofu init \
            -backend-config=../environments/prod/prod.tfbackend

      - name: Plan Production
        run: |
          cd tofu
          tofu plan \
            -var-file=../environments/prod/prod.tfvars \
            -out=../environments/prod/tfplan.out

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: prod-tfplan
          path: environments/prod/tfplan.out

  apply-prod:
    name: Apply Production
    runs-on: ubuntu-latest
    needs: plan-prod

    environment:
      name: production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: prod-tfplan
          path: environments/prod/

      - name: Apply Production
        run: |
          cd tofu
          tofu init \
            -backend-config=../environments/prod/prod.tfbackend
          tofu apply \
            -var-file=../environments/prod/prod.tfvars \
            ../environments/prod/tfplan.out
